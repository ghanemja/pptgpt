[build]
  publish = "netlify-dist"
  # netlify-dist/ is generated, not committed. build-netlify.mjs assembles it
  # from frontend/; gen-config.mjs then writes netlify-dist/config.js
  # (BU_API_BASE, empty unless set). Order matters — the build wipes the
  # directory first.
  command = "node scripts/build-netlify.mjs && node scripts/gen-config.mjs"

# One app: the workspace at "/". The old pages were deleted; their URLs
# redirect there so bookmarks still land somewhere useful.
[[redirects]]
  from = "/landing"
  to = "/"
  status = 301
[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/setup"
  to = "/"
  status = 301
[[redirects]]
  from = "/setup.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/storyboard"
  to = "/"
  status = 301
[[redirects]]
  from = "/storyboard.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/workbench"
  to = "/"
  status = 301
[[redirects]]
  from = "/workbench.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/workbench-v1"
  to = "/"
  status = 301
[[redirects]]
  from = "/workbench-v1.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/canvas"
  to = "/"
  status = 301
[[redirects]]
  from = "/canvas.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options    = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy    = "strict-origin-when-cross-origin"

# Cache the JSX/JS/CSS assets briefly so iteration on the demo
# doesn't get blocked by stale CDN copies. Set short, not zero.
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=60"
    Content-Type = "text/babel; charset=utf-8"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60"
