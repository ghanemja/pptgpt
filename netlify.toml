[build]
  publish = "netlify-dist"
  # Inject BU_API_BASE (this project's HF Space URL) into netlify-dist/config.js
  # at build time. See PORTFOLIO_ENV.md in brain-university for env-var setup.
  command = "node scripts/gen-config.mjs"

# Pretty URLs are on by default — Netlify will serve /workbench as
# /workbench.html, /storyboard as /storyboard.html, etc.
#
# /setup was a thin warmup page that duplicated workbench step 01
# without its upload + paste affordances. Redirected away so the
# canonical 5-phase app at /workbench is the single entry point.
[[redirects]]
  from = "/setup"
  to = "/workbench"
  status = 301
[[redirects]]
  from = "/setup.html"
  to = "/workbench"
  status = 301
# /storyboard was a different demo with different data; redirect to the
# canonical step 03 inside /workbench so there's only one storyboard.
[[redirects]]
  from = "/storyboard"
  to = "/workbench"
  status = 301
[[redirects]]
  from = "/storyboard.html"
  to = "/workbench"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options    = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy    = "strict-origin-when-cross-origin"

# Cache the JSX/JS/CSS assets briefly so iteration on the demo
# doesn't get blocked by stale CDN copies. Set short, not zero.
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=60"
    Content-Type = "text/babel; charset=utf-8"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60"
