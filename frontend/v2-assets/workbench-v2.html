  <!-- Suppress the benign host-harness ResizeObserver loop warning -->
  <script>
    (function () {
      const RE = /ResizeObserver loop/;
      const Native = window.ResizeObserver;
      if (Native) {
        window.ResizeObserver = function (cb) {
          let pending = 0;
          return new Native(function (entries, observer) {
            cancelAnimationFrame(pending);
            pending = requestAnimationFrame(function () {
              try { cb(entries, observer); } catch (_) {}
            });
          });
        };
        window.ResizeObserver.prototype = Native.prototype;
      }
      const origError = console.error;
      console.error = function () {
        if (arguments[0] && typeof arguments[0] === 'string' && RE.test(arguments[0])) return;
        return origError.apply(console, arguments);
      };
      window.addEventListener('error', function (e) {
        const msg = e && (e.message || (e.error && e.error.message)) || '';
        if (RE.test(msg)) { e.stopImmediatePropagation && e.stopImmediatePropagation(); e.preventDefault && e.preventDefault(); }
      }, true);
    })();
  </script>
</head>
