  <script>
    // Suppress the benign ResizeObserver loop warning (rAF-debounce)
    (function () {
      const RE = /ResizeObserver loop/;
      const Native = window.ResizeObserver;
      if (Native) {
        window.ResizeObserver = function (cb) {
          let pending = 0;
          return new Native(function (entries, observer) {
            cancelAnimationFrame(pending);
            pending = requestAnimationFrame(function () { try { cb(entries, observer); } catch (_) {} });
          });
        };
        window.ResizeObserver.prototype = Native.prototype;
      }
      const orig = console.error;
      console.error = function () {
        if (arguments[0] && typeof arguments[0] === 'string' && RE.test(arguments[0])) return;
        if (arguments[0] && arguments[0].message && RE.test(arguments[0].message)) return;
        return orig.apply(console, arguments);
      };
      window.addEventListener('error', function (e) {
        const m = e && (e.message || (e.error && e.error.message)) || '';
        if (RE.test(m)) { e.stopImmediatePropagation && e.stopImmediatePropagation(); e.preventDefault && e.preventDefault(); }
      }, true);
    })();
    // Minimal PLOT_FNS in case previewRenderer isn't loaded
    window.PLOT_FNS = window.PLOT_FNS || {
      sine:   (x, p) => (p.A ?? 1) * Math.sin((p.omega ?? 1) * x + (p.phi ?? 0)),
      damped: (x, p) => (p.A ?? 1) * Math.exp(-(p.gamma ?? 0.7) * x) * Math.cos((p.omega ?? 4.5) * x),
      gaussian: (x, p) => (p.A ?? 1) * Math.exp(-Math.pow((x - (p.mu ?? 3)) / (p.sigma ?? 1), 2) / 2),
    };
  </script>
