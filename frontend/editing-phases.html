<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pptgpt — editing phase, three modes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f0eee9; }
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }

    /* iframe shells — clean borderless windows */
    .pp-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #F4F1EA;
      display: block;
    }

    /* Caption strip inside each artboard (above the iframe) */
    .pp-caption {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6C7A89;
      background: linear-gradient(180deg, rgba(244,241,234,0.95), rgba(244,241,234,0));
      pointer-events: none;
      z-index: 2;
    }
    .pp-caption .pp-mode {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 500;
      color: #1A1A1A;
    }
    .pp-caption .pp-mode::before {
      content: ""; width: 6px; height: 6px; border-radius: 999px;
      background: #C9531C;
    }

    .pp-iframe-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #F4F1EA;
      overflow: hidden;
    }

    /* Loading placeholder */
    .pp-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94A3B8;
      pointer-events: none;
      transition: opacity 400ms;
    }
    .pp-loading.is-hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="vendor/react-18.3.1/react.production.min.js"></script>
  <script src="vendor/react-dom-18.3.1/react-dom.production.min.js"></script>
  <script src="vendor/babel-standalone-7.29.0/babel.min.js"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    const MODES = [
      {
        id: 'draft',
        label: 'A · Draft',
        title: 'Draft — a rough slide',
        subtitle: 'Paste raw notes; the canvas asks taste questions before drafting one styled slide.',
        sample: 0,
      },
      {
        id: 'refine',
        label: 'B · Refine',
        title: 'Refine — a half-done draft',
        subtitle: 'Paste what you have plus what feels off; the canvas reworks one slide.',
        sample: 0,
      },
      {
        id: 'condense',
        label: 'C · Condense',
        title: 'Condense — a full deck',
        subtitle: 'Paste a deck (slides separated by ---); the canvas returns a short version.',
        sample: 0,
      },
    ];

    function ArtboardInner({ mode }) {
      const [loaded, setLoaded] = useState(false);
      const src = `index.html?mode=${mode.id}&sample=${mode.sample}&go=1&chrome=0`;
      return (
        <div className="pp-iframe-wrap">
          <div className="pp-caption">
            <span className="pp-mode">mode · {mode.id}</span>
            <span>editing phase  ·  questions floating around the slide</span>
          </div>
          <iframe
            className="pp-iframe"
            src={src}
            title={mode.label}
            onLoad={() => setLoaded(true)}
          />
          <div className={`pp-loading ${loaded ? 'is-hidden' : ''}`}>
            loading {mode.id} …
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="pptgpt · editing phase"
          subtitle="three modes, three live previews · drift the cards in any of them · click ⤢ to inspect full-size"
        >
          {MODES.map(m => (
            <DCSection
              key={m.id}
              id={`sec-${m.id}`}
              title={m.title}
              subtitle={m.subtitle}
            >
              <DCArtboard
                id={`ab-${m.id}`}
                label={m.label}
                width={1280}
                height={760}
              >
                <ArtboardInner mode={m} />
              </DCArtboard>
            </DCSection>
          ))}
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
